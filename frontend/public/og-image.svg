<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d0a0a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#120608" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050304" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4a4a"/>
      <stop offset="100%" stop-color="#e82d2d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#e82d2d" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#050304"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle grid lines -->
  <line x1="80" y1="0" x2="80" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="1120" y1="0" x2="1120" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="550" x2="1200" y2="550" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Logo Mark -->
  <g transform="translate(80, 80) scale(1.6)" filter="url(#glow)">
    <path fill="url(#redGrad)" d="M10 50 L26 14 L40 14 L24 50 Z M40 14 L56 50 H68 L52 14 Z"/>
  </g>
  <text x="210" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="4">REACH STRATEGIES</text>

  <!-- Eyebrow Badge -->
  <rect x="80" y="220" width="380" height="38" rx="19" fill="rgba(232, 45, 45, 0.15)" stroke="rgba(232, 45, 45, 0.4)" stroke-width="1"/>
  <text x="100" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#ff5252" letter-spacing="2">DIGITAL MARKETING &amp; WEB SOLUTIONS</text>

  <!-- Main Headline -->
  <text x="80" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#ffffff" letter-spacing="-1">Efficient Strategy for</text>
  <text x="80" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="url(#redGrad)" letter-spacing="-1">Modern Brands.</text>

  <!-- Tagline / Services -->
  <text x="80" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#c4c4c4">Google Ads • AI SEO • Lead Generation • Web Development • Branding</text>

  <!-- Footer Info -->
  <text x="80" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#888888">reachstrategies.in</text>
  <text x="1120" y="585" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#ff5252">Hyderabad, India • Global Delivery</text>
</svg>
